<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
  <h1 class="display-6">Inscreva-se</h1>
  <form>
    <label class="form-label" for="nome">Nome completo:</label>
    <input class="form-control" type="text" id="nome" placeholder="Insira seu nome aqui">
    <label class="form-label" for="tel">Telefone</label>
    <input id="tel" class="form-control" type="tel" placeholder="(00) 000-000-000">
    <label class="form-label" for="email">E-mail</label>
    <input id="email" class="form-control" type="email" placeholder="example@email.com">
    <label for="senha" class="form-label">Senha</label>
    <input id="senha" class="form-control" type="password" placeholder="Insira a sua senha aqui">
    <button class="btn btn-info">Enviar</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
